<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthrough</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #F6F5F2); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
  @supports (height: 100dvh) { #stage { height: 100dvh; } }
  /* A narrow phone held upright: turn the 16:9 stage on its side so it fills the screen. */
  @media (orientation: portrait) and (max-width: 700px) {
    #stage { width: 100vh; height: 100vw; transform-origin: top left;
             transform: rotate(90deg) translateY(-100%); }
    @supports (height: 100dvh) { #stage { width: 100dvh; } }
  }
  svg { width: 100%; height: 100%; display: block; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  text { fill: var(--ink); pointer-events: none; }
  .t-title { font-size: 34px; font-weight: 600; }
  .t-layer { font-size: 22px; font-weight: 500; transition: opacity .4s; }
  .t-item { font-size: 19px; }
  .t-small { font-size: 18px; fill: var(--dim); }
  .t-cap { font-size: 30px; font-weight: 500; }
  .t-detail { font-size: 22px; fill: var(--dim); }
  .t-stop { font-size: 17px; font-weight: 700; text-anchor: middle; }
  .t-legend { font-size: 18px; }
  .t-filter { font-size: 22px; font-weight: 600; }

  .bg { fill: var(--bg); }
  .fade { transition: opacity .45s ease; }
  .plane-shadow { fill: var(--shadow); opacity: var(--shadow-op); }
  .plane-face { stroke: var(--plane-edge); stroke-width: 1.5; transition: stroke .4s, stroke-width .4s; }
  .plane.is-focus .plane-face { stroke: var(--line); stroke-width: 2.5; }
  .halo { fill: var(--panel); stroke: var(--plane-edge); stroke-width: 1.5; opacity: 0; }
  .halo.on { opacity: .55; }
  .band { fill: var(--band); stroke: var(--line); stroke-width: 2; }
  .band-on { fill: var(--teal); opacity: 0; }
  .band-on.on { opacity: 1; }
  .tree { stroke: var(--tree); stroke-width: 2; stroke-linecap: round; fill: none; }
  .tree-dot { fill: var(--tree); }
  .is-faint { opacity: .28; }
  .stop-path { fill: none; stroke: var(--tree); stroke-width: 3; stroke-linecap: round;
               stroke-dasharray: .1 11; opacity: .75; }

  .item { cursor: pointer; outline: none;
          transition: transform .6s cubic-bezier(.4, 0, .2, 1), opacity .45s ease; }
  .item .shape { fill: var(--node); stroke: var(--line); stroke-width: 2;
                 transition: fill .4s, stroke .4s, stroke-width .4s; }
  .item.is-active .shape { fill: var(--teal-fill); stroke: var(--teal); stroke-width: 2.5; }
  .item.is-selected .shape { fill: var(--amber-fill); stroke: var(--amber); stroke-width: 3; }
  .item.is-dim { opacity: .28; }
  .mode-filter .item.is-dim { opacity: .14; }
  .chip { fill: var(--chip); transition: fill .4s; }
  .chip.on { fill: var(--teal); }
  .chip-hit { fill: transparent; cursor: pointer; }
  .ring { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; opacity: 0; pointer-events: none; }
  .item:focus-visible .ring, .legend:focus-visible .ring, .stop:focus-visible .ring,
  .gate:focus-visible .ring, .ride:focus-visible .ring { opacity: 1; }

  .ghostable { transition: opacity .5s ease, transform .5s ease; }
  .mode-filter .ghostable { opacity: .5; }
  .panel-g { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .mode-filter .panel-g { opacity: 1; }
  .panel-shadow { fill: var(--shadow); opacity: var(--shadow-op); }
  .panel { fill: var(--panel); stroke: var(--plane-edge); stroke-width: 1.5; }
  .panel-chip { fill: var(--teal); }

  .tubes { transition: opacity .45s ease; pointer-events: none; }
  .mode-filter .tubes, .mode-filter .gate { opacity: 0; pointer-events: none; }
  .tube path { fill: none; stroke: var(--teal); stroke-linecap: round; }
  .tube .w1 { stroke-opacity: .16; stroke-width: 18; }
  .tube .w2 { stroke-opacity: .22; stroke-width: 10; }
  .tube .w3 { stroke-opacity: .9; stroke-width: 2; }
  .tube .start { fill: var(--bg); stroke: var(--teal); stroke-width: 2; }
  .tube .head-soft { fill: var(--teal); fill-opacity: .22; }
  .tube .head { fill: var(--teal); }
  .feed { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; transition: opacity .5s ease; }

  .gate { cursor: pointer; outline: none; transition: opacity .45s ease; }
  .gate .diamond { fill: var(--bg); stroke: var(--teal); stroke-width: 2.5; stroke-linejoin: round; transition: fill .4s; }
  .gate .bar { stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; transition: stroke .4s; }
  .gate.is-approved .diamond { fill: var(--teal); }
  .gate.is-approved .bar { stroke: var(--bg); }
  .gate .pulse { fill: none; stroke: var(--teal); stroke-width: 2; opacity: 0;
                 transform-box: fill-box; transform-origin: center; }
  .gate.is-waiting .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0% { opacity: .55; transform: scale(.7); } 70% { opacity: 0; transform: scale(1.5); }
                     100% { opacity: 0; transform: scale(1.5); } }

  .stop { cursor: pointer; outline: none; transition: transform .6s cubic-bezier(.4, 0, .2, 1); }
  .stop .dot { fill: var(--bg); stroke: var(--line); stroke-width: 2; transition: fill .3s; }
  .stop.is-current .dot { fill: var(--ink); }
  .stop.is-current text { fill: var(--bg); }

  .legend { cursor: pointer; outline: none; }
  .legend .pill { fill: var(--node); stroke: var(--chip); stroke-width: 1.5; transition: fill .4s, stroke .4s; }
  .legend .swatch { fill: var(--chip); transition: fill .4s; }
  .legend.on .pill { fill: var(--teal-fill); stroke: var(--teal); }
  .legend.on .swatch { fill: var(--teal); }


  /* ---- v2: the ride, the tunnel and the map view --------------------------- */
  .memb { fill: none; stroke: var(--teal); stroke-width: 1.2; opacity: 0; pointer-events: none; }
  [data-skin=calm] .memb { display: none; }
  .item.is-far { opacity: .5; }
  .mapping .item { transition: opacity .45s ease; }
  .ride { cursor: pointer; outline: none; transition: opacity .35s ease; }
  .ride path { fill: none; stroke: var(--teal); stroke-linecap: round; stroke-dasharray: 90 90;
               stroke-dashoffset: 52; transition: stroke-dashoffset .3s ease; }
  .ride .w1 { stroke-opacity: .16; stroke-width: 18; }
  .ride .w2 { stroke-opacity: .22; stroke-width: 10; }
  .ride .w3 { stroke-opacity: .9; stroke-width: 2; }
  .ride .head-soft { fill: var(--teal); fill-opacity: .22; }
  .ride .head { fill: var(--teal); }
  .ride .heads { transition: transform .3s ease; transform: translate(-40px, 6px); }
  .ride.is-go path { stroke-dashoffset: 0; }
  .ride.is-go .heads { transform: translate(0, 0); }
  .ride .breath { transform-box: fill-box; transform-origin: center; animation: beat 2.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  .tunnel-ring { fill: none; stroke: var(--teal); pointer-events: none; }
  .map-links { opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .map-on .map-links { opacity: 1; }
  .mlink { stroke: var(--tree); stroke-width: 1.5; stroke-linecap: round; opacity: .32;
           transition: opacity .4s, stroke .4s; }
  .mlink.is-hot { stroke: var(--teal); stroke-width: 3; opacity: .8; }
  .mpulse { fill: var(--teal); }
  .mode-map .ghostable { opacity: 0; transform: scale(1.22);
                         transition: opacity .8s ease, transform .9s cubic-bezier(.5, 0, .8, .4); }
  .mode-map .tubes, .mode-map .gate:not(.map-gate):not(.sys-gate), .mode-map .panel-g, .mode-map .ride { opacity: 0; pointer-events: none; }
  .mode-map .t-layer, .mode-map .t-conn { opacity: 0; }
  .t-conn { transition: opacity .4s; }
  .mode-map .chip-hit { display: none; }

  /* ---- v3: the systems view ------------------------------------------------- */
  .sys-g { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .mode-sys .sys-g { opacity: 1; pointer-events: auto; }
  .sysp { cursor: pointer; outline: none; transition: opacity .5s ease; }
  .sysp * { vector-effect: non-scaling-stroke; }
  .sysp-frame { fill: var(--panel); stroke: var(--plane-edge); stroke-width: 1.5; transition: stroke .4s; }
  .sysp.is-focus .sysp-frame { stroke: var(--line); stroke-width: 2; }
  .sysp.is-rail { opacity: .82; }
  .sysp:focus-visible > .ring, .sys-head:focus-visible .ring { opacity: 1; }
  .t-sys { font-size: 17px; font-weight: 600; }
  .t-ride { font-size: 13px; text-anchor: middle; }
  .sy-l { stroke: var(--tree); stroke-width: 1.5; fill: none; opacity: .7; }
  .sy-l2 { stroke: var(--line); stroke-width: 2.5; fill: none; }
  .sy-o { fill: none; stroke: var(--tree); stroke-width: 1.5; opacity: .8; }
  .sy-c { fill: var(--panel); stroke: var(--tree); stroke-width: 1.5; }
  .sy-s { fill: var(--plane0); }
  .sy-f { fill: var(--chip); opacity: .6; }
  .sy-a { fill: var(--teal); opacity: .75; }
  .sy-w { fill: var(--amber); opacity: .85; }
  .echo { fill: var(--node); stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .6;
          cursor: pointer; transition: opacity .45s ease; }
  .echo.is-off { opacity: 0; pointer-events: none; }
  .sys-tubes { opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  .mode-sys .sys-tubes { opacity: 1; }
  .stube path { fill: none; stroke: var(--teal); stroke-linecap: round; }
  .stube .w1 { stroke-opacity: .16; stroke-width: 12; display: none; }
  .stube .w2 { stroke-opacity: .22; stroke-width: 6; display: none; }
  .stube .w3 { stroke-opacity: .3; stroke-width: 1.5; }
  .stube.is-hot .w1, .stube.is-hot .w2 { display: inline; }
  .stube.is-hot .w3 { stroke-opacity: .9; stroke-width: 2; }
  .sys-head { outline: none; }
  .sys-head .head-soft { fill: var(--teal); fill-opacity: .22; transform-box: fill-box; transform-origin: center; }
  .sys-head .head { fill: var(--teal); }
  .mode-sys .sys-head.is-ready { pointer-events: auto; cursor: pointer; }
  .sys-head.is-ready .head-soft { animation: beat 2.6s ease-in-out infinite; }
  .ride-sys .heads { transform: translate(-40px, -10px); }
  .ride-sys.in-map .heads { transform: none; }
  .ride-sys.in-map path { stroke-dashoffset: 0; }
  .mode-map .ride.ride-sys.in-map { opacity: 1; pointer-events: auto; }
  [data-skin=vital] .sysp-frame { animation: breathe-soft 6s ease-in-out infinite; }
  [data-skin=vital] .t-sys, [data-skin=vital] .t-ride {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: .09em; }
  [data-skin=vital] .t-sys { font-size: 14px; }
  [data-skin=vital] .t-ride { font-size: 11px; }

  /* ---- v2: the "vital" skin ------------------------------------------------ */
  [data-skin=vital] .t-layer, [data-skin=vital] .t-small, [data-skin=vital] .t-legend,
  [data-skin=vital] .t-item, [data-skin=vital] .t-detail, [data-skin=vital] .t-filter {
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    text-transform: uppercase; letter-spacing: .09em; }
  [data-skin=vital] .t-item { font-size: 15px; }
  [data-skin=vital] .t-layer { font-size: 17px; }
  [data-skin=vital] .t-legend { font-size: 14px; }
  [data-skin=vital] .t-small { font-size: 14px; }
  [data-skin=vital] .t-detail { font-size: 17px; }
  [data-skin=vital] .t-filter { font-size: 18px; }
  [data-skin=vital] .t-title { font-weight: 500; letter-spacing: -.01em; }
  [data-skin=vital] .item .main { transform-box: fill-box; transform-origin: center;
                                  animation: breathe 5.6s ease-in-out infinite; }
  [data-skin=vital] .plane-face { animation: breathe-soft 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.022); opacity: .9; } }
  @keyframes breathe-soft { 0%, 100% { opacity: 1; } 50% { opacity: .8; } }
  [data-skin=vital] .tube .w1 { filter: url(#soft); stroke-opacity: .3; }
  .tube .w4 { fill: none; stroke: #fff; stroke-opacity: 0; stroke-width: 3; stroke-linecap: round;
              stroke-dasharray: 36 520; }
  [data-skin=vital] .tube.is-full .w4 { stroke-opacity: .32; animation: sheen 3.8s linear infinite; }
  @keyframes sheen { from { stroke-dashoffset: 556; } to { stroke-dashoffset: 0; } }
  [data-skin=vital] .gate.is-waiting .pulse { animation-duration: 2.6s; }
  [data-skin=vital] .mlink.is-hot { stroke-width: 4; opacity: .55; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .gate.is-waiting .pulse { opacity: .5; }
  }
</style>
</head>

<div id="stage"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
/* ---------------------------------------------------------------------------
   HOW TO LOAD REAL CONTENT
   Edit the CONTENT object below and nothing else. Every word shown on the page
   comes from it: the title, the three layer names, the twelve item labels, the
   five tag names and the six stop captions. The layout (LAYOUT) and the look
   (TOKENS) are the same data that drew the still plates, so positions match.
   The same picture also stands for modular systems (items) joined by
   connectors (the tubes), with an approval checkpoint (the gate) on a link.
   Interactions: open an item, pick a tag, step through the stops, and ride an
   open item's link into the map view (the same items, arranged by connection)
   or into the systems view (the same items, placed in six generic systems).
   CONTENT.systems names the six systems and says which items live in which,
   which system pairs are linked, and which link carries the gate. The six
   panels are generic types on purpose: relabel them, do not redraw them.
   Keys: Right / Left / Space step the stops, 1 to 9 jump, Enter or j rides in
   and out, Escape goes back one level, d flips light/dark, t flips the skin.
   THEME below picks the starting skin: "vital" or "calm".
--------------------------------------------------------------------------- */
const THEME = "vital";

const CONTENT = {
  title: "Two ways to find things, working together",
  layers: { base: "Shared base", group: "Group", personal: "Personal" },
  connector: "Connector",
  kinds: { folder: "Folder", file: "File" },
  items: {
    b1: "Item A1", b2: "Item B1", b3: "Item C1", b4: "Item D1",
    g1: "Item A2", g2: "Item B2", g3: "Item C2", g4: "Item D2",
    u1: "Item A3", u2: "Item B3", u3: "Item C3", u4: "Item D3"
  },
  tags: { t1: "Tag one", t2: "Tag two", t3: "Tag three", t4: "Tag four", t5: "Tag five" },
  stops: [
    "Every item has one home in the tree.",
    "Three layers stack: a shared base, a group layer and a personal layer.",
    "Open a branch to see what lives in it, layer by layer.",
    "Pick a tag and matching items link up across branches and layers.",
    "A gate holds a link until a person approves the crossing.",
    "Filter: the matching items gather into one tidy view.",
    "The same items, seen by connection.",
    "Where each item lives across systems.",
    "Following one item between systems."
  ],
  systems: {
    names: { sA: "System A: grid sheet", sB: "System B: document library", sC: "System C: data pipeline",
             sD: "System D: customer record", sE: "System E: ticket queue", sF: "System F: ledger" },
    /* kind picks the drawing: grid | library | pipeline | record | queue | ledger */
    kinds: { sA: "grid", sB: "library", sC: "pipeline", sD: "record", sE: "queue", sF: "ledger" },
    /* which items appear in each system (at most four per system) */
    members: { sA: ["b1", "g1", "b4", "u3"], sB: ["b2", "u1", "g2"], sC: ["g3", "u3", "b1", "b3"],
               sD: ["g4", "u4", "g1", "u1"], sE: ["g2", "u2", "g4", "u3"], sF: ["b3", "b4", "u4"] },
    /* where each item is drawn as the real element; elsewhere it shows as an echo */
    home: { b1: "sA", g1: "sA", b2: "sB", u1: "sB", g3: "sC", u3: "sC",
            g4: "sD", u4: "sD", g2: "sE", u2: "sE", b3: "sF", b4: "sF" },
    /* system-to-system links; one carries the approval gate */
    links: [ { a: "sA", b: "sC" }, { a: "sC", b: "sF" }, { a: "sA", b: "sF" }, { a: "sA", b: "sD" },
             { a: "sB", b: "sE" }, { a: "sD", b: "sE" }, { a: "sB", b: "sD" }, { a: "sC", b: "sE", gated: true },
             { a: "sA", b: "sE" }, { a: "sD", b: "sF" } ],
    /* the ride that stop 9 plays */
    demo: { item: "u3", from: "sC", to: "sE" }
  },
  ui: {
    hint: "Open an item, pick a tag, or step through the stops.",
    layerWord: "layer",
    tagsWord: "Tags",
    itemsWord: "items",
    stopWord: "Stop",
    waiting: "waiting for approval at the gate",
    approved: "approved",
    approve: "Approve this link",
    pickTag: "Pick tag",
    ride: "Ride this link to the map view",
    linksWord: "links",
    mapHint: "Pick another item to re-centre, or click empty space to return.",
    approveMap: "Approve this connection",
    rideMapWord: "Connections",
    rideSysWord: "Systems",
    rideSys: "Ride this link to the systems view",
    rideTo: "Ride to",
    sysWord: "systems",
    sysHint: "Pick a system, then an item, and follow a link to ride between systems.",
    approveSys: "Approve this system link"
  }
};

/* Same numbers as build_plates.py (canvas 1920 x 1080). */
const LAYOUT = {
  W: 1920, H: 1080,
  plane: { x: 200, w: 1520, h: 230, skew: -10, r: 18 },
  layers: [ { id: "base", y: 670 }, { id: "group", y: 400 }, { id: "personal", y: 130 } ],
  rowY: { base: 785, group: 515, personal: 245 },
  colX: { 1: 480, 2: 820, 3: 1160, 4: 1500 },
  folder: [160, 72], file: [132, 60], chip: [30, 10],
  band: { x: 104, y: 130, w: 20, h: 770 },
  items: [
    ["b1", "folder", "base", 1, ["t2", "t3"]], ["b2", "folder", "base", 2, ["t3", "t4"]],
    ["b3", "folder", "base", 3, ["t1", "t5"]], ["b4", "folder", "base", 4, ["t2", "t4", "t5"]],
    ["g1", "folder", "group", 1, ["t3", "t5"]], ["g2", "file", "group", 2, ["t1", "t4"]],
    ["g3", "folder", "group", 3, ["t2", "t3", "t4"]], ["g4", "file", "group", 4, ["t1", "t2"]],
    ["u1", "file", "personal", 1, ["t1", "t3"]], ["u2", "file", "personal", 2, ["t2", "t5"]],
    ["u3", "file", "personal", 3, ["t4", "t5"]], ["u4", "file", "personal", 4, ["t3", "t4"]]
  ],
  tagOrder: ["t1", "t2", "t3", "t4", "t5"],
  demoTag: "t1", demoItem: "u3",
  tuned: { t1: { chain: ["u1", "g2", "b3", "g4"], gate: 1,
                 ctrl: [[[600, 110], [780, 300]], [[960, 380], [1120, 560]], [[1320, 700], [1400, 420]]] } },
  stops: [[650, 708], [990, 708], [1330, 708], [1330, 438], [990, 438], [650, 438],
          [650, 168], [990, 168], [1330, 168]],
  mapStops: { x: 1340, y: 1000, gap: 54 },
  map: { c: [960, 505], r1: [430, 235], r2: [760, 345], rMin: 30, rMax: 56, gateIndex: 1 },
  stopR: 17,
  pathD: "M 330 708 L 1666 708 Q 1690 708 1690 684 L 1690 462 Q 1690 438 1666 438 " +
         "L 354 438 Q 330 438 330 414 L 330 192 Q 330 168 354 168 L 1690 168",
  trunkY: 880,
  filterRow: { y: 540, gap: 240, panel: [440, 420, 1040, 240] }
};

const TOKENS = {
  calm: {
    light: { bg: "#F6F5F2", ink: "#2B2F36", dim: "#8A8F98", line: "#2B2F36", tree: "#8A8F98", chip: "#C9CCD1",
             plane: ["#E4E3DF", "#EAE9E5", "#F0EFEB"], planeEdge: "#C9CCD1", node: "#FFFFFF",
             band: "#C9CCD1", teal: "#0F8B8D", amber: "#E8A33D", amberFill: "#FDF3E1",
             tealFill: "#E7F3F3", panel: "#FFFFFF", shadow: "#2B2F36", shadowOp: 0.07 },
    dark:  { bg: "#14171C", ink: "#D7DAE0", dim: "#8A8F98", line: "#D7DAE0", tree: "#8A8F98", chip: "#565D69",
             plane: ["#1B1F26", "#20252D", "#252B34"], planeEdge: "#3A414C", node: "#2A303A",
             band: "#565D69", teal: "#2BB3B5", amber: "#E8A33D", amberFill: "#3A2F1C",
             tealFill: "#173436", panel: "#2A303A", shadow: "#000000", shadowOp: 0.25 }
  },
  vital: {
    dark:  { bg: "#0e0f10", ink: "#e8e6e1", dim: "#a3a4a6", line: "#565b62", tree: "#4a4e55", chip: "#3a3d42",
             plane: ["#151618", "#191b1d", "#1d1f22"], planeEdge: "#2a2d31", node: "#1d1f22",
             band: "#2a2d31", teal: "#39d98a", amber: "#d98a2b", amberFill: "#2b2114",
             tealFill: "#12281e", panel: "#151618", shadow: "#000000", shadowOp: 0.35 },
    light: { bg: "#F6F5F2", ink: "#1d1f22", dim: "#6b6f76", line: "#3a3d42", tree: "#9a9da3", chip: "#cfd1d4",
             plane: ["#ECEBE7", "#F0EFEB", "#F4F3EF"], planeEdge: "#d5d6d3", node: "#FFFFFF",
             band: "#cfd1d4", teal: "#1fa56a", amber: "#d98a2b", amberFill: "#fbf0df",
             tealFill: "#e3f4ec", panel: "#FFFFFF", shadow: "#1d1f22", shadowOp: 0.06 }

      const c = MAP.cur[id];
      if (MAP.active && !SYS.active) applyItem(id, c.x, c.y, c.m, c.r);
    });
    if (SYS.active) sysKick();
  }
  relayoutText();

  /* ---- tubes --------------------------------------------------------------- */
  let tubes = [];      // one entry per link of the active chain
  let chainInfo = null;
  let raf = 0;

  function buildTubes() {
    tubes.forEach(function (t) { gTubes.removeChild(t.g); });
    tubes = [];
    chainInfo = S.tag ? chainFor(S.tag) : null;
    if (!chainInfo || !chainInfo.arcs.length) { gate.style.display = "none"; feed.setAttribute("opacity", 0); return; }
    chainInfo.arcs.forEach(function (a, k) {
      const d = "M " + a[0][0] + " " + a[0][1] + " C " + a[1][0] + " " + a[1][1] + " " + a[2][0] + " " + a[2][1] +
                " " + a[3][0] + " " + a[3][1];
      const g = el("g", { "class": "tube" }, gTubes);
      const paths = ["w1", "w2", "w3"].map(function (c) { return el("path", { d: d, "class": c }, g); });
      el("path", { d: d, "class": "w4" }, g);
      const start = el("circle", { cx: a[0][0], cy: a[0][1], r: 6, "class": "start" }, g);
      const soft = el("circle", { cx: a[0][0], cy: a[0][1], r: 13, "class": "head-soft" }, g);
      const head = el("circle", { cx: a[0][0], cy: a[0][1], r: 5.5, "class": "head" }, g);
      let len = 0;
      try { len = paths[0].getTotalLength(); } catch (e) { len = 0; }
      if (!len) len = 400;
      paths.forEach(function (p) { p.setAttribute("stroke-dasharray", len + " " + len); });
      let gateFrac = 0.5;
      if (k === chainInfo.gate) {
        const G = bez(a[0], a[1], a[2], a[3], 0.5);
        let best = 1e9;
        for (let i = 0; i <= 200; i++) {
          let pt;
          try { pt = paths[0].getPointAtLength(len * i / 200); } catch (e) { pt = null; }
          if (!pt) break;
          const dd = (pt.x - G[0]) * (pt.x - G[0]) + (pt.y - G[1]) * (pt.y - G[1]);
          if (dd < best) { best = dd; gateFrac = i / 200; }
        }
        gate.setAttribute("transform", "translate(" + G[0] + " " + G[1] + ")");
        gate.style.display = "";
      }
      g.style.display = "none";
      tubes.push({ g: g, paths: paths, start: start, soft: soft, head: head, len: len, p: 0,
                   gateFrac: gateFrac, anim: null });
    });
    const first = IT[chainInfo.chain[0]];
    feed.setAttribute("d", "M " + (L.band.x + L.band.w) + " " + (first.cy + 55) + " C 230 " + (first.cy + 55) + " " +
                      (first.x - 100) + " " + first.cy + " " + first.x + " " + first.cy);
    bandOn.setAttribute("y", first.cy - 30);
  }

  function target(k) {
    if (!chainInfo) return 0;
    return (k === chainInfo.gate && !S.approved) ? tubes[k].gateFrac : 1;
  }
  function paint(t) {
    t.g.style.display = t.p > 0.001 ? "" : "none";
    t.g.classList.toggle("is-full", t.p >= 0.999);
    t.paths.forEach(function (p) { p.setAttribute("stroke-dashoffset", t.len * (1 - t.p)); });
    let pt = null;
    try { pt = t.paths[0].getPointAtLength(t.len * t.p); } catch (e) { pt = null; }
    if (pt) {
      t.soft.setAttribute("cx", pt.x); t.soft.setAttribute("cy", pt.y);
      t.head.setAttribute("cx", pt.x); t.head.setAttribute("cy", pt.y);
    }
  }
  function gateState() {
    if (!chainInfo || !tubes.length) return;
    const t = tubes[chainInfo.gate];
    const waiting = !S.approved && t.p >= t.gateFrac - 0.002;
    gate.classList.toggle("is-waiting", waiting);
    gate.classList.toggle("is-approved", S.approved);
    gate.setAttribute("aria-pressed", S.approved ? "true" : "false");
  }
  /* Links grow one after another; nothing grows past a gate that is not approved. */
  function tick(now) {
    raf = 0;
    let busy = false;
    for (let k = 0; k < tubes.length; k++) {
      const t = tubes[k];
      const ready = k === 0 || tubes[k - 1].p >= 1;
      const to = target(k);
      if (!t.anim && ready && t.p < to - 0.001) {
        t.anim = { from: t.p, to: to, start: now, dur: Math.max(350, 1000 * (to - t.p)) };
      }
      if (t.anim) {
        const u = Math.min(1, (now - t.anim.start) / t.anim.dur);
        t.p = t.anim.from + (t.anim.to - t.anim.from) * ease(u);
        if (u >= 1) { t.p = t.anim.to; t.anim = null; }
        paint(t);
        busy = true;
      }
    }
    gateState();
    if (busy) raf = requestAnimationFrame(tick);
    else updateText();
  }
  function kick() {
    if (!tubes.length) return;
    if (reduce) {
      for (let k = 0; k < tubes.length; k++) {
        const ready = k === 0 || tubes[k - 1].p >= 1;
        tubes[k].p = ready ? target(k) : 0;
        tubes[k].anim = null;
        paint(tubes[k]);
      }
      gateState();
      updateText();
      return;
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  /* Pull the flow back behind the gate (used when a stop asks for "waiting"). */
  function holdAtGate() {
    if (!chainInfo) return;
    tubes.forEach(function (t, k) {
      t.anim = null;
      if (k === chainInfo.gate) t.p = Math.min(t.p, t.gateFrac);
      else if (k > chainInfo.gate) t.p = 0;
      paint(t);
    });
    gateState();
  }

  /* ---- render -------------------------------------------------------------- */
  let shownTag = null;
  function render() {
    const tag = S.tag;
    const sel = S.sel ? IT[S.sel] : null;
    const has = function (id) { return !!tag && IT[id].tags.indexOf(tag) >= 0; };

    if (tag !== shownTag) { buildTubes(); shownTag = tag; }

    /* matching items sit above the filter panel; move them before any position change */
    const moved = [];
    ORDER.forEach(function (id) {
      const want = (MAP.active || has(id)) ? gTop : gBase;
      if (nodes[id].g.parentNode !== want) { want.appendChild(nodes[id].g); moved.push(nodes[id].g); }
    });
    moved.forEach(function (g) { try { void window.getComputedStyle(g).transform; } catch (e) {} });

    const rowPos = (S.filter && chainInfo) ? filterPositions(chainInfo.chain) : null;
    svg.classList.toggle("mode-filter", !!rowPos);

    ORDER.forEach(function (id) {
      const n = IT[id], g = nodes[id].g;
      let dim = false;
      if (MAP.active) dim = false;
      else if (tag) dim = !has(id);
      else if (sel) dim = n.branch !== sel.branch;
      else if (S.layerFocus >= 0) dim = n.layer !== L.layers[S.layerFocus].id;
      g.classList.toggle("is-dim", dim);
      g.classList.toggle("is-active", has(id));
      g.classList.toggle("is-selected", S.sel === id);
      g.classList.toggle("is-far", S.map && id !== S.center && !SHARE[S.center][id]);
      g.setAttribute("aria-pressed", S.sel === id ? "true" : "false");
      const at = rowPos && rowPos[id] ? rowPos[id] : [n.x, n.y];
      if (!MAP.active) g.style.transform = "translate(" + at[0] + "px," + at[1] + "px)";
      for (const t in nodes[id].chips) nodes[id].chips[t].classList.toggle("on", t === tag && !dim);
    });

    const drill = !!sel && !tag && !MAP.active;
    planes.forEach(function (p, idx) {
      const focus = S.layerFocus === idx;
      p.classList.toggle("is-focus", focus);
      p.setAttribute("opacity", drill ? 0.6 : (S.layerFocus >= 0 && !focus ? 0.45 : 1));
      layerLabels[idx].setAttribute("opacity", S.layerFocus >= 0 && !focus ? 0.4 : 1);
      layerLabels[idx].setAttribute("font-weight", focus ? 700 : 500);
    });
    if (drill) halo.setAttribute("x", L.colX[sel.branch] - 128);
    halo.classList.toggle("on", drill);
    band.setAttribute("opacity", drill ? 0.5 : 1);
    bandOn.classList.toggle("on", !!tag);
    trunk.classList.toggle("is-faint", drill);
    Object.keys(branchLines).forEach(function (b) {
      branchLines[b].classList.toggle("is-faint", drill && String(sel.branch) !== String(b));
    });

    feed.setAttribute("opacity", tag && tubes.length ? 1 : 0);
    gate.setAttribute("opacity", tag && tubes.length ? 1 : 0);
    gate.setAttribute("tabindex", tag && tubes.length && !rowPos ? "0" : "-1");

    L.tagOrder.forEach(function (t) {
      legend[t].classList.toggle("on", t === tag);
      legend[t].setAttribute("aria-pressed", t === tag ? "true" : "false");
    });
    stops.forEach(function (g, k) {
      g.classList.toggle("is-current", k + 1 === S.stop);
      if (k + 1 === S.stop) g.setAttribute("aria-current", "step"); else g.removeAttribute("aria-current");
    });
    panelTitle.textContent = tag ? CONTENT.tags[tag] : "";

    const showRide = !!sel && !tag && (!MAP.active || MAP.riding);
    ride.style.display = showRide ? "" : "none";
    if (showRide) ride.setAttribute("transform", "translate(" + (sel.x + sel.w) + " " + sel.cy + ")");
    ride.setAttribute("tabindex", showRide && !MAP.active ? "0" : "-1");
    svg.classList.toggle("mapping", MAP.active);
    const sysStub = !MAP.riding && !SYS.active && ((!!sel && !tag && !MAP.active) || (S.map && !!S.center));
    rideS.style.display = sysStub ? "" : "none";
    rideS.classList.toggle("in-map", !!S.map);
    if (sysStub) {
      rideS.setAttribute("transform", S.map
        ? "translate(" + (L.map.c[0] + nodeR(S.center) + 4) + " " + L.map.c[1] + ")"
        : "translate(" + (sel.x + sel.w) + " " + sel.cy + ")");
    }
    rideS.setAttribute("tabindex", sysStub ? "0" : "-1");

    gateState();
    kick();
    updateText();
  }

  function updateText() {
    cap.textContent = CONTENT.stops[S.stop - 1];
    let d = CONTENT.ui.hint;
    if (S.sys) {
      if (S.sel) {
        const ss = sysOf(S.sel);
        d = CONTENT.items[S.sel] + "  ·  " + ss.length + " " + CONTENT.ui.sysWord;
        const gated = ss.some(function (x) { const l = linkOf(SYS.at[S.sel], x); return !!(l && l.gated); });
        if (gated) d += "  ·  " + (SYS.approved ? CONTENT.ui.approved : CONTENT.ui.waiting);
      } else if (SYS.focus) {
        d = SYSC.names[SYS.focus] + "  ·  " + SYSC.members[SYS.focus].length + " " + CONTENT.ui.itemsWord;
      } else d = CONTENT.ui.sysHint;
    } else if (S.map && S.center) {
      const nb = neighbours(S.center);
      d = CONTENT.items[S.center] + "  ·  " + nb.length + " " + CONTENT.ui.linksWord;
      if (nb.length > 1) d += "  ·  " + (S.mapApproved ? CONTENT.ui.approved : CONTENT.ui.waiting);
      d += "  ·  " + CONTENT.ui.mapHint;
    } else if (S.sel) {
      const n = IT[S.sel];
      d = CONTENT.items[S.sel] + "  ·  " + CONTENT.kinds[n.kind] + "  ·  " + CONTENT.layers[n.layer] + " " +
          CONTENT.ui.layerWord + "  ·  " + CONTENT.ui.tagsWord + ": " +
          n.tags.map(function (t) { return CONTENT.tags[t]; }).join(", ");
    } else if (S.tag && chainInfo) {
      d = CONTENT.tags[S.tag] + "  ·  " + chainInfo.chain.length + " " + CONTENT.ui.itemsWord;
      if (tubes.length && !S.filter) {
        const t = tubes[chainInfo.gate];
        if (S.approved) d += "  ·  " + CONTENT.ui.approved;
        else if (t.p >= t.gateFrac - 0.002) d += "  ·  " + CONTENT.ui.waiting;
      }
    }
    if (detail.textContent !== d) detail.textContent = d;
    const say = cap.textContent + " " + d;
    if (live.textContent !== say) live.textContent = say;
  }

  /* ---- the map engine: ride in, re-centre, ride back ------------------------ */
  function anyTween() { return ORDER.some(function (id) { return !!MAP.tw[id]; }); }
  function startLoop() { if (!MAP.raf) MAP.raf = requestAnimationFrame(frame); }
  function tweenTo(id, x, y, m, r, delay, dur) {
    const c = MAP.cur[id];
    MAP.tw[id] = { fx: c.x, fy: c.y, fm: c.m, fr: c.r, tx: x, ty: y, tm: m, tr: r, t0: null, delay: delay, dur: dur,
                   fs: c.custom ? { w: c.w, h: c.h, rx: c.rx, lx: c.lx, ly: c.ly } : null };
  }
  function drawLinks(now) {
    const c = S.center;
    const settled = S.map && !anyTween();
    const nb = S.map && c ? neighbours(c) : [];
    const gatedTo = nb.length > 1 ? nb[L.map.gateIndex % nb.length] : null;
    let hotK = 0, gateShown = false;
    LINKS.forEach(function (lk) {
      const A = centreOf(lk.a), B = centreOf(lk.b);
      lk.line.setAttribute("x1", A[0]); lk.line.setAttribute("y1", A[1]);
      lk.line.setAttribute("x2", B[0]); lk.line.setAttribute("y2", B[1]);
      const hot = S.map && (lk.a === c || lk.b === c);
      lk.line.classList.toggle("is-hot", hot);
      if (!hot || !settled) { lk.pulse.style.display = "none"; return; }
      const other = lk.a === c ? lk.b : lk.a;
      const U0 = centreOf(c), U1 = centreOf(other);
      const dx = U1[0] - U0[0], dy = U1[1] - U0[1], len = Math.sqrt(dx * dx + dy * dy) || 1;
      const s0 = MAP.cur[c].r / len, s1 = 1 - MAP.cur[other].r / len;
      const gated = other === gatedTo;
      let t = 0.5, show = true;
      if (gated && !S.mapApproved) {
        if (reduce) t = 0.5;
        else { if (MAP.gateT0 === null) MAP.gateT0 = now; t = Math.min(0.5, (now - MAP.gateT0) / 1300 * 0.5); }
      } else if (reduce) { show = false; }
      else { t = ((now / 2800) + hotK * 0.173) % 1; }
      const at = s0 + (s1 - s0) * t;
      lk.pulse.style.display = show ? "" : "none";
      lk.pulse.setAttribute("cx", U0[0] + dx * at); lk.pulse.setAttribute("cy", U0[1] + dy * at);
      if (gated) {
        const mid = s0 + (s1 - s0) * 0.5;
        mapGate.setAttribute("transform", "translate(" + (U0[0] + dx * mid) + " " + (U0[1] + dy * mid) + ")");
        mapGate.classList.toggle("is-waiting", !S.mapApproved && t >= 0.499);
        mapGate.classList.toggle("is-approved", S.mapApproved);
        mapGate.setAttribute("aria-pressed", S.mapApproved ? "true" : "false");
        gateShown = true;
      }
      hotK++;
    });
    mapGate.style.display = gateShown ? "" : "none";
    mapGate.setAttribute("tabindex", gateShown ? "0" : "-1");
  }
  function frame(now) {
    MAP.raf = 0;
    MAP.lastNow = now;
    let busy = false;
    if (MAP.tunnel) {
      const T = MAP.tunnel;
      if (T.start === null) T.start = now;
      rings.forEach(function (c, i) {
        const u = clamp01((now - T.start - 250 - i * 95) / 900);
        c.setAttribute("cx", T.o[0]); c.setAttribute("cy", T.o[1]);
        c.setAttribute("r", 20 + 1500 * u * u);
        c.setAttribute("stroke-width", 6 + 60 * u);
        c.setAttribute("opacity", u > 0 && u < 1 ? 0.34 * (1 - u) : 0);
      });
      busy = true;
    }
    let moving = false;
    ORDER.forEach(function (id) {
      const w = MAP.tw[id];
      if (!w) return;
      if (w.t0 === null) w.t0 = now + w.delay;
      const u = clamp01((now - w.t0) / w.dur), e = ease(u);
      if (w.fs && u < 1) {
        const n = IT[id], tw2 = lerp(n.w, 2 * w.tr, w.tm), th2 = lerp(n.h, 2 * w.tr, w.tm);
        applyItem(id, lerp(w.fx, w.tx, e), lerp(w.fy, w.ty, e), lerp(w.fm, w.tm, e), lerp(w.fr, w.tr, e),
          { w: lerp(w.fs.w, tw2, e), h: lerp(w.fs.h, th2, e), rx: lerp(w.fs.rx, lerp(TOKENS.radius, w.tr, w.tm), e),
            memb: e, lx: lerp(w.fs.lx, lerp(n.w / 2 + 12, n.w / 2 - nodes[id].tw / 2, w.tm), e),
            ly: lerp(w.fs.ly, lerp(n.h + 32, n.h / 2 + th2 / 2 + 28, w.tm), e) });
      } else applyItem(id, lerp(w.fx, w.tx, e), lerp(w.fy, w.ty, e), lerp(w.fm, w.tm, e), lerp(w.fr, w.tr, e));
      if (u >= 1) MAP.tw[id] = null; else moving = true;
    });
    if (MAP.active) drawLinks(now);
    if (!moving && !MAP.tunnel && MAP.onDone) { const f = MAP.onDone; MAP.onDone = null; f(); }
    if (moving || busy || (S.map && !reduce)) { if (MAP.active) startLoop(); }
  }
  function hideRings() { rings.forEach(function (c) { c.setAttribute("opacity", 0); }); }
  function landInMap(instant) {
    MAP.tunnel = null; MAP.riding = false;
    hideRings();
    ride.classList.remove("is-go");
    S.map = true; S.sel = S.center; S.mapApproved = false; MAP.gateT0 = null;
    const pos = mapLayout(S.center);
    ORDER.forEach(function (id, k) {
      const n = IT[id], x = pos[id][0] - n.w / 2, y = pos[id][1] - n.h / 2, r = nodeR(id);
      if (instant) { MAP.tw[id] = null; applyItem(id, x, y, 1, r); }
      else tweenTo(id, x, y, 1, r, k * 35, 800);
    });
    svg.classList.add("map-on");
    placeStops(true);
    render();
    if (instant) drawLinks(MAP.lastNow); else startLoop();
  }
  function rideIn(id) {
    if (!id || MAP.active) return;
    clearTimers();
    S.tag = null; S.approved = false; S.filter = false; S.layerFocus = -1;
    S.sel = id; S.center = id; S.stop = 7;
    MAP.active = true; MAP.onDone = null;
    ORDER.forEach(function (o) { MAP.tw[o] = null; applyItem(o, IT[o].x, IT[o].y, 0, nodeR(o)); });
    const n = IT[id], o = [n.x + n.w + 78, n.cy - 14];
    gGhost.style.transformOrigin = o[0] + "px " + o[1] + "px";
    if (reduce) {
      svg.classList.add("mode-map");
      landInMap(true);
      crossFade();
      return;
    }
    MAP.riding = true;
    render();
    ride.classList.add("is-go");
    MAP.tunnel = { start: null, o: o };
    later(function () { svg.classList.add("mode-map"); }, 250);
    later(function () { landInMap(false); }, 1150);
    startLoop();
  }
  /* Reduced motion: no tunnel and no drift, only a short fade into the map. */
  function crossFade() {
    const t0 = { v: null };
    function step(now) {
      if (t0.v === null) t0.v = now;
      const u = clamp01((now - t0.v) / 300);
      gTop.setAttribute("opacity", u); gMap.style.opacity = String(u);
      if (u < 1) requestAnimationFrame(step); else { gTop.removeAttribute("opacity"); gMap.style.opacity = ""; }
    }
    gTop.setAttribute("opacity", 0);
    requestAnimationFrame(step);
  }
  function recentre(id) {
    if (!S.map || id === S.center) return;
    S.center = id; S.sel = id; S.mapApproved = false; MAP.gateT0 = null;
    const pos = mapLayout(id);
    ORDER.forEach(function (o, k) {
      const n = IT[o], x = pos[o][0] - n.w / 2, y = pos[o][1] - n.h / 2;
      if (reduce) { MAP.tw[o] = null; applyItem(o, x, y, 1, nodeR(o)); }
      else tweenTo(o, x, y, 1, nodeR(o), k * 15, 700);
    });
    render();
    if (reduce) drawLinks(MAP.lastNow); else startLoop();
  }
  function approveMap() {
    if (!S.map || S.mapApproved) return;
    S.mapApproved = true;
    if (reduce) drawLinks(MAP.lastNow); else startLoop();
    updateText();
  }
  /* Ride back: every item returns to its home in the tree. snap = no animation. */
  function rideBack(snap) {
    if (SYS.active) { sysExit(snap); return; }
    if (!MAP.active) return;
    clearTimers();
    S.map = false; MAP.riding = false; MAP.tunnel = null; MAP.onDone = null;
    hideRings();
    ride.classList.remove("is-go");
    svg.classList.remove("map-on");
    svg.classList.remove("mode-map");
    mapGate.style.display = "none";
    LINKS.forEach(function (lk) { lk.pulse.style.display = "none"; });
    placeStops(false);
    if (S.stop >= 7) S.stop = 3;   /* an open item is the drill-down stop */
    function done() {
      MAP.active = false;
      ORDER.forEach(function (o) { MAP.tw[o] = null; applyItem(o, IT[o].x, IT[o].y, 0, nodeR(o)); });
      render();
    }
    if (snap || reduce) { done(); return; }
    ORDER.forEach(function (o, k) { tweenTo(o, IT[o].x, IT[o].y, 0, nodeR(o), k * 30, 800); });
    MAP.onDone = done;
    render();
    startLoop();
  }

  /* ---- v3: the systems view --------------------------------------------------
     Six generic system panels. The same twelve item elements drift into them;
     an item that lives in several systems is a real element in one panel and a
     soft echo in the others, joined by thin liquid tubes. */
  const SYSC = CONTENT.systems, SYSIDS = Object.keys(SYSC.names);
  const PW = 520, PH = 350;
  function tiles(list) { return list.map(function (a) { return { x: a[0], y: a[1], w: a[2], h: 26 }; }); }
  const SLOTS = {
    grid: tiles([[22, 89, 110], [22, 127, 110], [22, 203, 110], [22, 241, 110]]),
    library: tiles([[116, 114, 106], [248, 114, 106], [380, 114, 106], [116, 218, 106]]),
    pipeline: tiles([[21, 69, 100], [21, 134, 100], [21, 199, 100], [21, 264, 100]]),
    record: tiles([[189, 124, 140], [189, 160, 140], [357, 124, 140], [357, 160, 140]]),
    queue: tiles([[32, 98, 124], [198, 98, 124], [364, 98, 124], [32, 178, 124]]),
    ledger: tiles([[24, 87, 150], [24, 123, 150], [24, 159, 150], [24, 195, 150]])
  };
  function Ln(g, a, b, c, d, cls) { return el("line", { x1: a, y1: b, x2: c, y2: d, "class": cls || "sy-l" }, g); }
  function Ci(g, x, y, r, cls) { return el("circle", { cx: x, cy: y, r: r, "class": cls }, g); }
  const DRAW = {
    grid: function (g) {

  }
  function sysStop(n) {
    if (!S.sys) enterSys(MAP.active ? null : [L.W / 2, L.H / 2]); else clearTimers();
    S.stop = n;
    if (n === 8) { setFocus(null, null); return; }
    const d = SYSC.demo;
    setFocus(d.from, d.item);
    later(approveSys, reduce ? 1200 : 2600);
    later(function () { rideSys(d.to); }, reduce ? 2400 : 4400);
  }

  /* ---- the three interactions ---------------------------------------------- */
  function openItem(id) {
    if (MAP.active) return;
    clearTimers();
    S.layerFocus = -1;
    S.sel = S.sel === id ? null : id;
    render();
  }
  function closeItem() {
    if (!S.sel) return;
    S.sel = null;
    render();
  }
  function pickTag(tag) {
    if (MAP.active) rideBack(true);
    clearTimers();
    S.layerFocus = -1;
    S.sel = null;
    if (S.tag === tag && !S.filter) { S.tag = null; S.approved = false; }
    else { S.tag = tag; S.approved = false; S.filter = false; if (shownTag === tag) holdAtGate(); }
    render();
  }
  function approve() {
    if (!S.tag || S.approved) return;
    clearTimers();
    S.approved = true;
    render();
  }
  function goStop(n) {
    n = Math.max(1, Math.min(L.stops.length, n));
    if (n === 7) {
      if (S.sys) sysToMap(S.sel || L.demoItem);
      else if (!MAP.active) rideIn(S.sel && !S.tag ? S.sel : L.demoItem);
      return;
    }
    if (n >= 8) { sysStop(n); return; }
    if (MAP.active) rideBack(true);
    clearTimers();
    S.stop = n; S.sel = null; S.filter = false; S.layerFocus = -1;
    if (n === 1) { S.tag = null; S.approved = false; }
    else if (n === 2) {
      S.tag = null; S.approved = false;
      if (!reduce) {
        const seq = [0, 1, 2, -1];
        S.layerFocus = 0;
        seq.slice(1).forEach(function (v, k) {
          later(function () { S.layerFocus = v; render(); }, 1500 * (k + 1));
        });
      }
    }
    else if (n === 3) { S.tag = null; S.approved = false; S.sel = L.demoItem; }
    else if (n === 4 || n === 5) {
      const same = S.tag === L.demoTag;
      S.tag = L.demoTag; S.approved = false;
      if (same && shownTag === L.demoTag) holdAtGate();
      if (n === 5) later(function () { approve(); }, reduce ? 1200 : 3200);
    }
    else if (n === 6) { S.tag = L.demoTag; S.approved = true; S.filter = true; }
    render();
  }

  /* ---- events -------------------------------------------------------------- */
  function act(target) {
    if (target.closest(".ride-sys")) { goSysFrom(); return true; }
    if (S.sys) {
      const hd = target.closest(".sys-head");
      if (hd) { rideSys(hd.getAttribute("data-sys")); return true; }
      if (target.closest(".sys-gate")) { approveSys(); return true; }
      const st = target.closest(".stop");
      if (st) { goStop(parseInt(st.getAttribute("data-stop"), 10)); return true; }
      const lg = target.closest(".legend");
      if (lg) { pickTag(lg.getAttribute("data-tag")); return true; }
      const ec = target.closest(".echo");
      if (ec) { setFocus(ec.getAttribute("data-sys"), ec.getAttribute("data-id")); return true; }
      const it = target.closest(".item");
      if (it) {
        const id = it.getAttribute("data-id");
        if (SYS.focus === SYS.at[id]) selectSys(id); else setFocus(SYS.at[id], id);
        return true;
      }
      const pn = target.closest(".sysp");
      if (pn) {
        const sy = pn.getAttribute("data-sys");
        if (SYS.focus === sy) { if (S.sel) selectSys(S.sel); } else setFocus(sy, null);
        return true;
      }
      return false;
    }
    if (target.closest(".ride")) { rideIn(S.sel); return true; }
    if (target.closest(".map-gate")) { approveMap(); return true; }
    const chip = target.closest(".chip-hit, .legend");
    if (chip) { pickTag(chip.getAttribute("data-tag")); return true; }
    if (target.closest(".gate")) { approve(); return true; }
    const stop = target.closest(".stop");
    if (stop) { goStop(parseInt(stop.getAttribute("data-stop"), 10)); return true; }
    const item = target.closest(".item");
    if (item) {
      if (S.map) recentre(item.getAttribute("data-id")); else openItem(item.getAttribute("data-id"));
      return true;
    }
    return false;
  }
  svg.addEventListener("click", function (e) {
    if (!act(e.target)) { if (S.sys) sysBack(); else if (MAP.active) rideBack(false); else closeItem(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const focused = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest(".item, .legend, .stop, .gate, .ride, .sys-head, .sysp") : null;
    if ((e.key === "Enter" || e.key === " ") && focused) { e.preventDefault(); act(focused); return; }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); if (S.stop < L.stops.length) goStop(S.stop + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goStop(S.stop - 1); }
    else if (e.key === "Escape") {
      if (S.sys) { sysBack(); return; }
      if (MAP.active) { rideBack(false); return; }
      clearTimers(); S.sel = null; S.tag = null; S.approved = false; S.filter = false; S.layerFocus = -1; render();
    }
    else if (e.key === "j" || e.key === "J" || e.key === "Enter") {
      e.preventDefault();
      if (MAP.active) rideBack(false);
      else if (e.key !== "Enter" || S.sel) rideIn(S.sel && !S.tag ? S.sel : L.demoItem);
    }
    else if (e.key === "d" || e.key === "D") { flipTheme(); }
    else if (e.key === "t" || e.key === "T") { flipSkin(); }
    else if (/^[1-9]$/.test(e.key)) { goStop(parseInt(e.key, 10)); }
  });

  goStop(1);
})();
</script>
</body>
</html>
