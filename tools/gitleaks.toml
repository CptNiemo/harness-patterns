# gitleaks.toml — the export lane's secret-scanner config (gate G4). Exported verbatim as tools/gitleaks.toml.
# Extends the gitleaks default ruleset with additional shapes. Generic patterns only — no owner literal.
title = "harness-patterns export lane"

[extend]
useDefault = true

[[rules]]
id = "push-monitor-token"
description = "push-monitor heartbeat token in a URL (status-page style /api/push/<token>)"
regex = '''api/push/[A-Za-z0-9_-]{8,}'''
keywords = ["api/push/"]

[[rules]]
id = "webhook-id"
description = "automation-platform webhook id (a capability token)"
regex = '''webhook/[A-Za-z0-9_-]{24,}'''
keywords = ["webhook/"]

[[rules]]
id = "mesh-vpn-authkey"
description = "mesh-VPN node auth key"
regex = '''\btskey-[A-Za-z0-9_-]+'''
keywords = ["tskey-"]

[[rules]]
id = "tunnel-token"
description = "reverse-tunnel connector token (long base64 after a tunnel keyword)"
regex = '''(?i)(tunnel[_-]?token|TUNNEL_TOKEN)[ ]*[:=][ ]*["']?[A-Za-z0-9_=-]{60,}'''
keywords = ["tunnel_token", "TUNNEL_TOKEN", "tunnel-token"]

[[rules]]
id = "lan-ip"
description = "RFC 1918 192.168/16 address"
regex = '''\b192\.168\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["192.168."]

[[rules]]
id = "cgnat-ip"
description = "100.64.0.0/10 carrier-grade address (mesh VPN)"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "magicdns"
description = "Mesh-VPN magic DNS hostname"
regex = '''\b[a-z0-9-]+\.ts\.net\b'''
keywords = [".ts.net"]

[[rules]]
id = "private-email"
description = "Personal e-mail at a consumer provider"
regex = '''[A-Za-z0-9._%+-]+@(gmail|googlemail|outlook|hotmail|live|yahoo|proton|protonmail|icloud)\.[a-z]{2,}'''
keywords = ["@gmail", "@googlemail", "@outlook", "@hotmail", "@live", "@yahoo", "@proton", "@icloud"]

[allowlist]
description = "Documentation placeholders and reserved example ranges"
regexes = [
  '''<LAN_IP>''',
  '''<TAILNET_IP>''',
  '''<TAILNET>\.ts\.net''',
  '''tailnet-example\.ts\.net''',
  '''\b203\.0\.113\.[0-9]{1,3}\b''',
  '''\b198\.51\.100\.[0-9]{1,3}\b''',
  '''\b192\.0\.2\.[0-9]{1,3}\b''',
  '''[0-9]+\+[A-Za-z0-9-]+@users\.noreply\.github\.com''',
  '''owner@example\.com''',
]
paths = [
  '''^tools/gate-generic\.rules$''',
  '''^tools/gitleaks\.toml$''',
]
